
<!DOCTYPE html>
<html>

<head>
    <title>DrivePlyr Video Upload - By SopDrive - Video/File Upload - Free Unlimited - Direct Link</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="../logo.png" type="image/x-icon">
</head>

<body>
    <div class="container mt-5">
        <h2>SopDrive - Video/File Upload</h2>
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="fileOption">Choose an upload option:</label>
                <select id="fileOption" class="form-control">
                    <option value="local">Select and Upload</option>
                    <option value="remote">Remote Upload</option>
                </select>
            </div>

            <div id="localUpload" class="mb-3">
                <input type="file" class="form-control" name="file" id="videoFile">
            </div>

            <div id="remoteUpload" class="mb-3" style="display: none;">
                <input type="text" class="form-control" name="url" id="videoURL" placeholder="Enter video URL">
            </div>

            <div class="progress mb-3" style="display: none;">
                <div id="progressBar" class="progress-bar progress-bar-striped" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>

            <button type="submit" class="btn btn-primary">Upload</button>
        </form>

        <div id="uploadResult" class="mt-3" style="display: none;">
            <p>Upload complete! Here are the details:</p>
            <hr>
            <form action="https://driveplyr.appspages.online/dashboard/add.php" method="get">
               <input type="text" name="url" id="url" style="width: fit-content;"> <button class="btn btn-success" type="submit" readonly> CONTINUE UPLOAD </button>
            </form>
            

            <hr>
            <p>File ID: <span id="fileId"></span></p>
            <p>File Name: <span id="fileName"></span></p>
            <p>File Size: <span id="fileSize"></span> bytes</p>
            <p>Download URL: <a id="downloadLink" href="#" target="_blank">Download File</a> - <span id="1"></span>
                <button class="btn btn-sm btn-secondary" onclick="copyDownloadLink()">Copy</button>
            </p>
            <p>Sharing URL: <a id="sharingLink" href="#" target="_blank">SopDrive Files</a> - 
            <span id="2"></span>
                <button class="btn btn-sm btn-secondary" onclick="copySharingLink()">Copy</button>
            </p>
        </div>
    </div>

    <!-- jQuery and Bootstrap JS links -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    
            function copyDownloadLink() {
                copyToClipboard(document.getElementById("1").innerHTML);
                alert("Download link copied to clipboard!");
            }

            function copySharingLink() {
                document.getElementById("2").innerHTML;
                alert("Sharing link copied to clipboard!");
            }
            function copyToClipboard(text) {
    // Create a temporary textarea element
    var textarea = document.createElement("textarea");

    // Set the value of the textarea to the provided text
    textarea.value = text;

    // Append the textarea to the document body
    document.body.appendChild(textarea);

    // Select the text inside the textarea
    textarea.select();

    // Copy the selected text to the clipboard
    document.execCommand("copy");

    // Remove the temporary textarea
    document.body.removeChild(textarea);

    // Alert the user that the text has been copied
    //alert("Text copied to clipboard: " + text);
}

            
        $(document).ready(function() {
            $("#fileOption").change(function() {
                var selectedOption = $(this).val();
                if (selectedOption === "local") {
                    $("#localUpload").show();
                    $("#remoteUpload").hide();
                } else if (selectedOption === "remote") {
                    $("#localUpload").hide();
                    $("#remoteUpload").show();
                }
            });

            $("#uploadForm").on("submit", function(e) {
                e.preventDefault();

                var formData = new FormData(this);
                var progressBar = $("#progressBar");
                var uploadResult = $("#uploadResult");
                var downloadLink = $("#downloadLink");
                var sharingLink = $("#sharingLink");
                var fileId = $("#fileId");
                var fileName = $("#fileName");
                var fileSize = $("#fileSize");

                $.ajax({
                    url: "https://sopdrive.appspages.online/api.php",
                    type: "POST",
                    data: formData,
                    dataType: "json",
                    contentType: false,
                    processData: false,
                    xhr: function() {
                        var xhr = $.ajaxSettings.xhr();
                        if (xhr.upload) {
                            xhr.upload.addEventListener("progress", function(e) {
                                if (e.lengthComputable) {
                                    var progress = Math.round((e.loaded / e.total) * 100);
                                    progressBar.width(progress + "%").attr("aria-valuenow", progress).text(progress + "%");
                                }
                            }, false);
                        }
                        return xhr;
                    },
                    beforeSend: function() {
                        progressBar.parent().show();
                        progressBar.width("0%").attr("aria-valuenow", 0).text("0%");
                    },
                    success: function(data) {
                        progressBar.parent().hide();
                        uploadResult.show();
                        fileId.text(data.id);
                        fileName.text(data.name);
                        fileSize.text(data.size);
                        downloadLink.attr("href", "https://sopdrive.appspages.online/download/" + data.id);
                        document.getElementById("1").innerHTML = "https://sopdrive.appspages.online/download/" + data.id;
                        document.getElementById("url").value = "https://sopdrive.appspages.online/download/" + data.id;
                        document.getElementById("2").innerHTML = "https://sopdrive.appspages.online/view/" + data.id;
                        sharingLink.attr("href", "https://sopdrive.appspages.online/view/" + data.id);
                        $('#2').html("https://sopdrive.appspages.online/view/" + data.id);
                    },
                    error: function() {
                        progressBar.parent().hide();
                        alert("An error occurred during the upload.");
                    }
                });
            });

            
        });
        

            
    </script>
</body>

</html>
